<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Бизнес-схема работы ESAnalys</title>
  <desc id="desc">Как один идентификатор превращается в понятную цепочку запросов и ответов для ручного разбора и интеграционных проверок.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#245c73"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#123041" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f5f7fa; }
      .title { font: 700 34px Arial, sans-serif; fill: #173244; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #526579; }
      .card { fill: #ffffff; stroke: #d6dee7; stroke-width: 1.5; }
      .card-blue { fill: #edf7fb; stroke: #b8dbea; stroke-width: 1.5; }
      .card-green { fill: #edf8f2; stroke: #b9ddca; stroke-width: 1.5; }
      .card-yellow { fill: #fff8e8; stroke: #ecd28a; stroke-width: 1.5; }
      .num { fill: #245c73; }
      .num-text { font: 700 22px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .h { font: 700 21px Arial, sans-serif; fill: #173244; text-anchor: middle; }
      .p { font: 400 15px Arial, sans-serif; fill: #526579; text-anchor: middle; }
      .small { font: 400 14px Arial, sans-serif; fill: #526579; text-anchor: middle; }
      .lane { font: 700 17px Arial, sans-serif; fill: #245c73; }
      .arrow { stroke: #245c73; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .bus { stroke: #8aa9b7; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .down-arrow { stroke: #8aa9b7; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="62">ESAnalys: от одного идентификатора до понятной истории операции</text>
  <text class="subtitle" x="64" y="95">Сервис связывает receiptid, rquid и uid, собирает request/response и отдает результат человеку или автопроверке</text>

  <g filter="url(#shadow)">
    <rect class="card" x="64" y="155" width="190" height="150" rx="12"/>
    <rect class="card" x="304" y="155" width="190" height="150" rx="12"/>
    <rect class="card-blue" x="544" y="155" width="190" height="150" rx="12"/>
    <rect class="card-blue" x="784" y="155" width="190" height="150" rx="12"/>
    <rect class="card-green" x="1024" y="155" width="190" height="150" rx="12"/>
  </g>

  <g>
    <circle class="num" cx="159" cy="198" r="23"/>
    <text class="num-text" x="159" y="206">1</text>
    <text class="h" x="159" y="240">Есть только ID</text>
    <text class="p" x="159" y="270">receiptid, rquid</text>
    <text class="p" x="159" y="292">или uid из теста</text>

    <circle class="num" cx="399" cy="198" r="23"/>
    <text class="num-text" x="399" y="206">2</text>
    <text class="h" x="399" y="240">ESAnalys</text>
    <text class="p" x="399" y="270">понимает тип ID</text>
    <text class="p" x="399" y="292">и запускает поиск</text>

    <circle class="num" cx="639" cy="198" r="23"/>
    <text class="num-text" x="639" y="206">3</text>
    <text class="h" x="639" y="240">Логи</text>
    <text class="p" x="639" y="270">Elasticsearch</text>
    <text class="p" x="639" y="292">Purchase API</text>

    <circle class="num" cx="879" cy="198" r="23"/>
    <text class="num-text" x="879" y="206">4</text>
    <text class="h" x="879" y="240">Цепочка</text>
    <text class="p" x="879" y="270">request + response</text>
    <text class="p" x="879" y="292">URL, body, status</text>

    <circle class="num" cx="1119" cy="198" r="23"/>
    <text class="num-text" x="1119" y="206">5</text>
    <text class="h" x="1119" y="240">Сводка</text>
    <text class="p" x="1119" y="270">что найдено</text>
    <text class="p" x="1119" y="292">и где ошибка</text>
  </g>

  <path class="arrow" d="M258 230 H296"/>
  <path class="arrow" d="M498 230 H536"/>
  <path class="arrow" d="M738 230 H776"/>
  <path class="arrow" d="M978 230 H1016"/>

  <g filter="url(#shadow)">
    <rect class="card-yellow" x="132" y="390" width="280" height="130" rx="12"/>
    <rect class="card-green" x="500" y="390" width="280" height="130" rx="12"/>
    <rect class="card-blue" x="868" y="390" width="280" height="130" rx="12"/>
  </g>

  <text class="lane" x="132" y="360">Кому помогает</text>

  <text class="h" x="272" y="430">Тестировщик</text>
  <text class="p" x="272" y="462">видит всю историю чека</text>
  <text class="p" x="272" y="484">без ручного поиска</text>

  <text class="h" x="640" y="430">Интеграционная проверка</text>
  <text class="p" x="640" y="462">получает короткий JSON</text>
  <text class="p" x="640" y="484">found, has_error, chain</text>

  <text class="h" x="1008" y="430">Смежная команда</text>
  <text class="p" x="1008" y="462">быстро получает</text>
  <text class="p" x="1008" y="484">обратную связь</text>

  <path class="bus" d="M1119 305 V350 H272"/>
  <path class="down-arrow" d="M272 350 V382"/>
  <path class="down-arrow" d="M640 350 V382"/>
  <path class="down-arrow" d="M1008 350 V382"/>

  <rect x="246" y="585" width="788" height="70" rx="12" fill="#ffffff" stroke="#d6dee7"/>
  <text class="h" x="640" y="616">Главный результат</text>
  <text class="small" x="640" y="642">Один входной ID превращается в понятный ответ: клиент, чек, цепочка Purchase API и место сбоя</text>
</svg>
