<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ESAnalys для бизнеса</title>
  <desc id="desc">Инфографика: как ESAnalys сокращает путь от непонятного сбоя в интеграции до ясного ответа по операции.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#123041" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,2 L8,5 L2,8 Z" fill="#315f75"/>
    </marker>
    <style>
      .bg { fill: #f6f7f9; }
      .title { font: 700 38px Arial, sans-serif; fill: #142f40; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #526579; }
      .card { fill: #ffffff; stroke: #d7dee7; stroke-width: 1.5; }
      .soft-red { fill: #fff1ed; stroke: #f1b6a8; }
      .soft-blue { fill: #edf6fb; stroke: #b8d8e8; }
      .soft-green { fill: #edf8f2; stroke: #b9ddca; }
      .label { font: 700 18px Arial, sans-serif; fill: #315f75; letter-spacing: 0.2px; }
      .h { font: 700 25px Arial, sans-serif; fill: #142f40; text-anchor: middle; }
      .p { font: 400 17px Arial, sans-serif; fill: #455a6c; text-anchor: middle; }
      .tiny { font: 400 15px Arial, sans-serif; fill: #5f7282; text-anchor: middle; }
      .callout { font: 400 18px Arial, sans-serif; fill: #455a6c; text-anchor: middle; }
      .metric { font: 700 42px Arial, sans-serif; fill: #245c73; text-anchor: middle; }
      .metric2 { font: 700 34px Arial, sans-serif; fill: #176b5d; text-anchor: middle; }
      .arrow { stroke: #315f75; stroke-width: 3.5; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .icon { font: 700 30px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <text class="title" x="640" y="62" text-anchor="middle">ESAnalys: быстро понять, что случилось с операцией</text>
  <text class="subtitle" x="640" y="96" text-anchor="middle">Вместо ручного поиска по логам - один идентификатор, понятная цепочка и короткий ответ для проверки</text>

  <g filter="url(#shadow)">
    <rect class="card soft-red" x="64" y="165" width="300" height="230" rx="16"/>
    <rect class="card soft-blue" x="490" y="165" width="300" height="230" rx="16"/>
    <rect class="card soft-green" x="916" y="165" width="300" height="230" rx="16"/>
  </g>

  <text class="label" x="214" y="145" text-anchor="middle">Было</text>
  <text class="label" x="640" y="145" text-anchor="middle">Что делает сервис</text>
  <text class="label" x="1066" y="145" text-anchor="middle">Стало</text>

  <circle cx="214" cy="220" r="34" fill="#cc5a43"/>
  <text class="icon" x="214" y="231">?</text>
  <text class="h" x="214" y="282">Разрозненные логи</text>
  <text class="p" x="214" y="321">есть номер чека</text>
  <text class="p" x="214" y="345">но нет ясной картины</text>


  <circle cx="640" cy="220" r="34" fill="#245c73"/>
  <text class="icon" x="640" y="231">ID</text>
  <text class="h" x="640" y="282">Связывает события</text>
  <text class="p" x="640" y="321">receiptid, rquid и uid</text>
  <text class="p" x="640" y="345">собираются в одну историю</text>


  <circle cx="1066" cy="220" r="34" fill="#176b5d"/>
  <text class="icon" x="1066" y="231">OK</text>
  <text class="h" x="1066" y="282">Понятный итог</text>
  <text class="p" x="1066" y="321">видно, что прошло</text>
  <text class="p" x="1066" y="345">и на каком шаге сбой</text>


  <path class="arrow" d="M382 280 H454"/>
  <path class="arrow" d="M808 280 H880"/>

  <g filter="url(#shadow)">
    <rect class="card" x="112" y="450" width="238" height="126" rx="14"/>
    <rect class="card" x="392" y="450" width="238" height="126" rx="14"/>
    <rect class="card" x="672" y="450" width="238" height="126" rx="14"/>
    <rect class="card" x="952" y="450" width="238" height="126" rx="14"/>
  </g>

  <text class="label" x="640" y="425" text-anchor="middle">В результате получаем</text>

  <text class="metric" x="231" y="500">Один ID</text>
  <text class="tiny" x="231" y="532">достаточно для старта</text>
  <text class="tiny" x="231" y="555">разбора операции</text>

  <text class="metric" x="511" y="500">Цепочка</text>
  <text class="tiny" x="511" y="532">запросы и ответы</text>
  <text class="tiny" x="511" y="555">в правильном порядке</text>

  <text class="metric2" x="791" y="500">Меньше</text>
  <text class="tiny" x="791" y="532">ручного поиска</text>
  <text class="tiny" x="791" y="555">и спорных трактовок</text>

  <text class="metric2" x="1071" y="500">Быстрее</text>
  <text class="tiny" x="1071" y="532">ответ партнёру</text>
  <text class="tiny" x="1071" y="555">и смежным командам</text>

  <rect x="330" y="592" width="620" height="86" rx="14" fill="#ffffff" stroke="#d7dee7"/>
  <text class="label" x="640" y="616" text-anchor="middle">Основная идея</text>
  <text class="callout" x="640" y="644">ESAnalys переводит технические логи на язык решения:</text>
  <text class="callout" x="640" y="666">найдено, не найдено, где сбой и что было в сообщениях</text>

</svg>
