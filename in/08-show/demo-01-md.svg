  <text x="24" y="192" fill="#dcdcaa" font-weight="700">## Проблематика</text>
  <text x="24" y="216" fill="#d4d4d4" font-family="Segoe UI, sans-serif">При запуске Ленты разница между суммой</text>
  <text x="24" y="236" fill="#d4d4d4" font-family="Segoe UI, sans-serif">по позициям чека и итогом корзины…</text>
  <text x="24" y="264" fill="#d4d4d4" font-family="Segoe UI, sans-serif">- логи объёмные — вручную не просмотреть</text>
  <text x="24" y="284" fill="#d4d4d4" font-family="Segoe UI, sans-serif">- корзина и оплата в разных местах</text>
