<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fun</title>
  <style>
    :root {
      --bg: #f6f6f4;
      --fg: #111111;
      --muted: #4a4a4a;
      --accent: #0057ff;
      --accent-dim: rgba(0, 87, 255, 0.15);
      --line: #d8d8d4;
      --overlay: rgba(8, 8, 12, 0.68);
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --bar-h: 72px;
      --demo-head-h: 10vh;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: #000;
      color: var(--fg);
      user-select: none;
    }

    #deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    /* —— шапка проекта + шаги —— */
    .talk-header {
      flex: 0 0 auto;
      padding: 1.4vh 3.5vw 1.1vh;
      border-bottom: 4px solid var(--fg);
      background: var(--bg);
    }

    .talk-identity {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.35em 1.5em;
    }

    .project-title {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35em 0.5em;
      font-size: clamp(28px, 4vw, 56px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
      flex: 1 1 auto;
      min-width: 0;
    }

    .project-author {
      font-size: clamp(18px, 2.1vw, 32px);
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .talk-step {
      font-size: 0.72em;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    /* —— контентные слайды —— */
    .slide.content {
      background: var(--bg);
    }

    .slide-body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 1.6vh 3.5vw 11vh;
      overflow: auto;
      font-size: clamp(20px, 2.1vw, 32px);
      line-height: 1.45;
      max-width: 1280px;
    }

    .slide-body ul, .slide-body ol { margin: 0.6em 0 0.6em 1.2em; }
    .slide-body li { margin: 0.35em 0; }
    .slide-body p { margin: 0.5em 0; }
    .slide-body strong { font-weight: 800; }

    .slide-body img,
    .slide-body svg {
      display: block;
      max-width: min(96vw, 1100px);
      max-height: 58vh;
      margin: 0.8em auto;
      border: 2px solid var(--fg);
      background: #fff;
    }

    .slide-body table { border-collapse: collapse; margin: 1em 0; font-size: 0.85em; }
    .slide-body th, .slide-body td { border: 2px solid var(--fg); padding: 0.45em 0.75em; }
    .slide-body th { background: var(--fg); color: var(--bg); }

    /* —— демо (тот же светлый стиль, что и content) —— */
    .slide.demo {
      background: var(--bg);
      color: var(--fg);
    }

    .demo-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 1vh 3.5vw 11vh;
      max-width: 100%;
    }

    .demo-intro {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: clamp(17px, 1.75vw, 26px);
      line-height: 1.35;
      margin-bottom: 0.8vh;
      max-height: 10vh;
      overflow: hidden;
    }

    .demo-intro:empty { display: none; }

    .demo-intro p { margin: 0.35em 0; }

    .demo-media {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .demo-media img,
    .demo-media video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: min(96vw, 1280px);
      max-height: calc(100vh - var(--bar-h) - var(--demo-head-h) - 2vh);
      object-fit: contain;
      object-position: center center;
      border: 2px solid var(--fg);
      background: #fff;
    }

    /* —— welcome / questions —— */
    .slide.cinematic {
      color: #fff;
      align-items: stretch;
      justify-content: flex-start;
    }

    .bg-video-stack {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      z-index: 0;
      transition: none;
      pointer-events: none;
    }

    /* нижний слой — всегда на полной яркости */
    .bg-video.is-base {
      opacity: 1;
      z-index: 1;
    }

    /* верхний слой — только проявление 0→1, без затухания нижнего */
    .bg-video.is-overlay {
      z-index: 2;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      will-change: opacity;
    }

    .bg-video.is-overlay.reveal {
      opacity: 1;
    }

    .cinematic-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      background: rgba(8, 8, 14, 0.78);
      border-bottom: 3px solid rgba(255, 255, 255, 0.15);
      padding: 2.2vh 5vw 2.4vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .cinematic-content {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .cinematic h1 {
      font-size: clamp(32px, 5vw, 72px);
      font-weight: 900;
      line-height: 1.08;
      margin-bottom: 0.2em;
    }

    .cinematic .subtitle {
      font-size: clamp(18px, 2.2vw, 32px);
      font-weight: 500;
      color: #e8e8e8;
    }

    .hint {
      position: fixed;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    #progress-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 8px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: var(--bar-h);
      justify-content: center;
    }

    #progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    #progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      font-weight: 600;
    }

    #progress-label { color: #ccc; }
    #progress-count { color: #fff; font-variant-numeric: tabular-nums; }

  </style>
</head>
<body>
  <div id="deck" aria-live="polite"></div>
  <div class="hint">Колесо / стрелки · F11</div>

  <div id="progress-bar">
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="progress-meta">
      <span id="progress-label">—</span>
      <span id="progress-count">0 / 0</span>
    </div>
  </div>

  <script>
    const SLIDES = [{"type": "welcome", "title": "AI Fun", "subtitle": "Команда партнерской интеграции", "videos": ["assets/00-welcome/kling_20260519_作品____________5493_0.mp4", "assets/00-welcome/kling_20260522_作品____________3862_0.mp4", "assets/00-welcome/kling_20260522_作品____________3958_0.mp4", "assets/00-welcome/kling_20260523_作品____________1057_0.mp4", "assets/00-welcome/kling_20260523_作品____________1102_0.mp4", "assets/00-welcome/kling_20260523_作品____________1121_0.mp4", "assets/00-welcome/kling_20260523_作品____________1205_0.mp4", "assets/00-welcome/kling_20260523_作品____________1213_0.mp4", "assets/00-welcome/kling_20260523_作品____________1655_0.mp4", "assets/00-welcome/kling_20260523_作品____________1707_0.mp4", "assets/00-welcome/kling_20260523_作品____________1729_0.mp4", "assets/00-welcome/kling_20260523_作品____________1751_0.mp4", "assets/00-welcome/kling_20260523_作品____________1792_0.mp4"], "block_id": "00-welcome"}, {"type": "section", "block_id": "01-logos", "section": "проблема", "section_title": "Проблема", "step_id": "проблема", "html": "<p>После обновлений в приложении иногда неправильно считалась итоговая стоимость корзины. Разобраться в причинах мешало:</p>\n<ul>\n<li>логи содержали <strong>сотни вложенных JSON</strong> — вручную их не просмотреть</li>\n<li><strong>receiptId</strong> (идентификатор чека) и <strong>сумма оплаты</strong> лежали в разных местах</li>\n<li>на один чек могло быть несколько ответов с разными статусами (<code>HLD</code>, <code>CLD</code>, <code>NEW</code>)</li>\n</ul>\n<p>В итоге на поиск одного дефекта уходили часы.</p>", "block_title": "Logos — Парсер логов приложения", "author": "Григорий Сидоров"}, {"type": "section", "block_id": "01-logos", "section": "инструменты", "section_title": "Инструменты", "step_id": "инструменты", "html": "<ul>\n<li><strong>Python 3</strong> — написали утилиту с оконным интерфейсом</li>\n<li><strong>Регулярные выражения</strong> — вычленяют URL-паттерны и идентификаторы</li>\n<li><strong>Tkinter</strong> — таблицы и вкладки, чтобы не работать в консоли</li>\n</ul>", "block_title": "Logos — Парсер логов приложения", "author": "Григорий Сидоров"}, {"type": "section", "block_id": "01-logos", "section": "решение", "section_title": "Решение", "step_id": "решение", "html": "<p>Сделали <strong>парсер логов</strong>, который сам находит все чеки, достаёт товары, скидки и реальную сумму оплаты — и показывает в удобной таблице.</p>\n<ul>\n<li>Сам ищет URL <code>/purchases/{receiptId}/bonusSpend</code> и <code>/confirmation</code></li>\n<li>Сравнивает расчётную оплату с фактической (<code>bankCardAmount</code>)</li>\n<li>Если структуры нет — переключается в резервный режим и ищет по статусам <code>HLD</code> → <code>CLD</code> → <code>NEW</code></li>\n</ul>\n<p><img alt=\"Схема работы парсера\" src=\"assets/01-logos/scheme.svg\" /></p>", "block_title": "Logos — Парсер логов приложения", "author": "Григорий Сидоров"}, {"type": "demo", "block_id": "01-logos", "src": "assets/01-logos/demo-01.mp4", "mime": "video", "index": 1, "total": 2, "step_id": "демо-1", "intro_html": "<p>Покажем на двух примерах:</p>\n<ul>\n<li>Загружаем лог мобильного приложения — видим список чеков, таблицу товаров и итоги.</li>\n<li>Открываем десктопный лог — парсер находит чеки даже без стандартных URL, через резервный поиск по статусам.</li>\n</ul>", "block_title": "Logos — Парсер логов приложения", "author": "Григорий Сидоров"}, {"type": "demo", "block_id": "01-logos", "src": "assets/01-logos/demo-02.mp4", "mime": "video", "index": 2, "total": 2, "step_id": "демо-2", "intro_html": "", "block_title": "Logos — Парсер логов приложения", "author": "Григорий Сидоров"}, {"type": "section", "block_id": "01-logos", "section": "вопросы?", "section_title": "Вопросы?", "step_id": "вопросы?", "html": "<ul>\n<li>Что делать, если в логе вообще нет JSON с товарами?</li>\n<li>Парсер умеет искать чеки, если URL записаны не в стандартном виде?</li>\n<li>Можно ли сохранить результаты, чтобы показать разработчикам?</li>\n</ul>", "block_title": "Logos — Парсер логов приложения", "author": "Григорий Сидоров"}, {"type": "section", "block_id": "02-AnalysLogs", "section": "проблема", "section_title": "Проблема", "step_id": "проблема", "html": "<p>Партнёрские проверки раньше зависели от ручной работы: нужно было собрать логи, понять, к какому тест-кейсу они относятся, сверить их с чек-листом и отдельно объяснить партнёру, что именно не прошло.</p>\n<ul>\n<li>Один и тот же набор тестов мог оформляться по-разному у разных партнёров</li>\n<li>Ошибки в логах находились поздно, уже после долгого ручного разбора</li>\n<li>Команде нужен был подробный отчёт, а партнёру — короткая понятная сводка</li>\n</ul>", "block_title": "AnalysLogs: проверка партнёрских логов", "author": "Команда приёмки интеграций"}, {"type": "section", "block_id": "02-AnalysLogs", "section": "инструменты", "section_title": "Инструменты", "step_id": "инструменты", "html": "<ul>\n<li><strong>HTML-форма для партнёра</strong> — помогает заполнить тест-кейсы и сохранить результат в одном TXT-файле</li>\n<li><strong>Нормализатор логов</strong> — приводит HTML-выгрузку, TXT, LOG, JSON или ZIP к единому виду</li>\n<li><strong>Excel-чек-лист</strong> — хранит правила, по которым сверяются запросы и ответы</li>\n<li><strong>CLI-проверка и отчёты</strong> — запускает проверки и создаёт PDF/DOCX для команды и партнёра</li>\n</ul>", "block_title": "AnalysLogs: проверка партнёрских логов", "author": "Команда приёмки интеграций"}, {"type": "section", "block_id": "02-AnalysLogs", "section": "решение", "section_title": "Решение", "step_id": "решение", "html": "<p>Сделали автономный процесс: партнёр получает тест-кейсы и HTML-страницу, проходит интеграционное тестирование, а команда одним запуском получает проверку и два отчёта.</p>\n<ul>\n<li>В форме уже есть минимальные подсказки и проверки по полям, чтобы партнёр сразу видел базовые ошибки</li>\n<li>Система сама распознаёт HTML-выгрузку и создаёт нормализованный <code>canonical.txt</code></li>\n<li>\n<p>Проверки берутся из актуального чек-листа, поэтому правила не нужно вручную переносить в отчёт</p>\n</li>\n<li>\n<p><code>scheme-01.svg</code></p>\n</li>\n<li><code>demo-01.gif</code></li>\n<li><code>demo-02.gif</code></li>\n</ul>", "block_title": "AnalysLogs: проверка партнёрских логов", "author": "Команда приёмки интеграций"}, {"type": "demo", "block_id": "02-AnalysLogs", "src": "assets/02-AnalysLogs/demo-01.gif", "mime": "image", "index": 1, "total": 3, "step_id": "демо-1", "intro_html": "<p>Покажем полный путь: открыть форму, вставить лог по тест-кейсу, сохранить TXT и запустить проверку.</p>\n<ul>\n<li>После запуска видно, сколько проверок прошло, не прошло и сколько осталось без данных</li>\n<li>В полном отчёте команда видит детали по каждому правилу</li>\n<li>В партнёрском отчёте остаётся только короткая сводка проблем и исключённых кейсов</li>\n</ul>", "block_title": "AnalysLogs: проверка партнёрских логов", "author": "Команда приёмки интеграций"}, {"type": "demo", "block_id": "02-AnalysLogs", "src": "assets/02-AnalysLogs/demo-02.gif", "mime": "image", "index": 2, "total": 3, "step_id": "демо-2", "intro_html": "", "block_title": "AnalysLogs: проверка партнёрских логов", "author": "Команда приёмки интеграций"}, {"type": "demo", "block_id": "02-AnalysLogs", "src": "assets/02-AnalysLogs/scheme-01.svg", "mime": "image", "index": 3, "total": 3, "step_id": "демо-3", "intro_html": "", "block_title": "AnalysLogs: проверка партнёрских логов", "author": "Команда приёмки интеграций"}, {"type": "section", "block_id": "02-AnalysLogs", "section": "вопросы?", "section_title": "Вопросы?", "step_id": "вопросы?", "html": "<ul>\n<li>Что делать, если партнёр прислал не HTML-выгрузку, а архив или обычный лог?</li>\n<li>Как понять, какие тест-кейсы исключили из итоговой проверки и почему?</li>\n<li>Кто обновляет чек-лист, если меняются сценарии или правила проверки?</li>\n</ul>", "block_title": "AnalysLogs: проверка партнёрских логов", "author": "Команда приёмки интеграций"}, {"type": "section", "block_id": "03-ESAnalys", "section": "проблема", "section_title": "Проблема", "step_id": "проблема", "html": "<p>Для разбора ситуаций, когда интеграционный тест падает или поступает общание от смежных команд, одного номера чека или request id часто недостаточно: нужно понять, какие запросы реально прошли, где был ответ и что лежало в теле сообщения, что вызвало ошибку. Раньше для этого приходилось собирать вручную по логам, а цепочка могла быть разбросана по разным сервисам и временным меткам.</p>\n<ul>\n<li>Один сценарий может иметь несколько связанных идентификаторов: <code>receiptid</code>, <code>rquid</code>, <code>uid</code></li>\n<li>Запрос и ответ не всегда лежат рядом, а часть логов относится к вспомогательным сервисам</li>\n<li>Команде нужно быстро объяснить статус проверки: что произошло, где ошибка, какой клиент и чек участвовали</li>\n</ul>", "block_title": "ESAnalys", "author": "Команда Отдел партнёрской интеграции"}, {"type": "section", "block_id": "03-ESAnalys", "section": "инструменты", "section_title": "Инструменты", "step_id": "инструменты", "html": "<ul>\n<li><strong>Web-интерфейс ESAnalys</strong> - поиск по одному идентификатору и просмотр цепочки Purchase API</li>\n<li><strong>Elasticsearch</strong> - источник логов, где сервис ищет события по <code>receiptid</code>, <code>rquid</code> и <code>uid</code></li>\n<li><strong>Внешнее API</strong> - <code>POST /api/summary</code> для автопроверок и подключения сторонних сервисов(агентов)</li>\n<li><strong>Postman-коллекция</strong> - быстрый ручной прогон контрактов без подготовки отдельного клиента</li>\n</ul>", "block_title": "ESAnalys", "author": "Команда Отдел партнёрской интеграции"}, {"type": "section", "block_id": "03-ESAnalys", "section": "решение", "section_title": "Решение", "step_id": "решение", "html": "<p>ESAnalys превращает разрозненные логи в понятную историю операции: ввели любой известный идентификатор - получили цепочку запросов и ответов по чеку.</p>\n<ul>\n<li>Сервис сам находит связанные <code>uid</code>, <code>rquid</code>, <code>receiptid</code> и идентификатору клиента</li>\n<li>Для Purchase API собираются пары <code>Запрос/Ответ</code>, URL, статус и тело сообщений</li>\n<li>\n<p>UI подходит для ручного разбора, а <code>/api/summary</code> возвращает короткий JSON для внешних проверок</p>\n</li>\n<li>\n<p><code>scheme-01.svg</code></p>\n</li>\n<li><code>scheme-02.svg</code></li>\n<li><code>demo-01.gif</code></li>\n<li><code>demo-02.png</code></li>\n<li><code>demo-03.png</code></li>\n</ul>", "block_title": "ESAnalys", "author": "Команда Отдел партнёрской интеграции"}, {"type": "demo", "block_id": "03-ESAnalys", "src": "assets/03-ESAnalys/demo-01.gif", "mime": "image", "index": 1, "total": 5, "step_id": "демо-1", "intro_html": "<p>Покажем путь от одного идентификатора до понятной сводки.</p>\n<ul>\n<li>Вводим <code>receiptid</code> или <code>rquid</code> в интерфейсе и видим бизнес-цепочку по чеку</li>\n<li>Раскрываем request/response body и проверяем, какие данные ушли и что вернулось</li>\n<li>Отправляем <code>POST /api/summary</code> и получаем компактный ответ: найдено ли событие, какие идентификаторы связаны, сколько пар собрано</li>\n<li>Для интеграционного теста достаточно проверить <code>found</code>, <code>has_error</code>, <code>summary.chain</code> и нужные поля body</li>\n</ul>", "block_title": "ESAnalys", "author": "Команда Отдел партнёрской интеграции"}, {"type": "demo", "block_id": "03-ESAnalys", "src": "assets/03-ESAnalys/demo-02.png", "mime": "image", "index": 2, "total": 5, "step_id": "демо-2", "intro_html": "", "block_title": "ESAnalys", "author": "Команда Отдел партнёрской интеграции"}, {"type": "demo", "block_id": "03-ESAnalys", "src": "assets/03-ESAnalys/demo-03.png", "mime": "image", "index": 3, "total": 5, "step_id": "демо-3", "intro_html": "", "block_title": "ESAnalys", "author": "Команда Отдел партнёрской интеграции"}, {"type": "demo", "block_id": "03-ESAnalys", "src": "assets/03-ESAnalys/scheme-01.svg", "mime": "image", "index": 4, "total": 5, "step_id": "демо-4", "intro_html": "", "block_title": "ESAnalys", "author": "Команда Отдел партнёрской интеграции"}, {"type": "demo", "block_id": "03-ESAnalys", "src": "assets/03-ESAnalys/scheme-02.svg", "mime": "image", "index": 5, "total": 5, "step_id": "демо-5", "intro_html": "", "block_title": "ESAnalys", "author": "Команда Отдел партнёрской интеграции"}, {"type": "section", "block_id": "03-ESAnalys", "section": "вопросы?", "section_title": "Вопросы?", "step_id": "вопросы?", "html": "<ul>\n<li>Какие поля из <code>summary</code> должны стать обязательными для автоматических проверок?</li>\n<li>Нужен ли отдельный набор правил для разных контуров или партнёров?</li>\n<li>Что считать успешным результатом: отсутствие ошибок, полный набор request/response или конкретный статус операции?</li>\n<li>Кто будет обновлять правила распознавания, если в Purchase API появятся новые методы?</li>\n</ul>", "block_title": "ESAnalys", "author": "Команда Отдел партнёрской интеграции"}, {"type": "section", "block_id": "04-Golem", "section": "проблема", "section_title": "Проблема", "step_id": "проблема", "html": "<p>В поддержке и эксплуатации снова и снова спрашивают одно и то же: <strong>что известно по этому терминалу</strong>, <strong>есть ли такой мерчант в базе</strong>, <strong>к какой точке обслуживания (ТСП) привязан объект</strong>, <strong>были ли операции за последние дни</strong>.</p>\n<ul>\n<li>Раньше инженер сам открывал базу или ждал отчёт в другой системе — на простой ответ уходили <strong>минуты</strong></li>\n<li>Один и тот же номер в логах называется по-разному — легко ошибиться и смотреть не то поле</li>\n<li>Обычный чат с нейросетью может ответить уверенно, но <strong>без проверки по реальным данным</strong> — ошибки всплывали уже у партнёра</li>\n</ul>", "block_title": "GOLEM — поиск по идентификаторам", "author": "Команда платформы · GOLEM"}, {"type": "section", "block_id": "04-Golem", "section": "инструменты", "section_title": "Инструменты", "step_id": "инструменты", "html": "<ul>\n<li><strong>GOLEM</strong> — умный помощник: принимает вопрос обычным текстом, из лога или из фрагмента JSON</li>\n<li><strong>База операционных данных</strong> — справочник терминалов и таблица транзакций (только чтение, без изменений)</li>\n<li><strong>GigaChat</strong> — понимает формулировку вопроса и собирает понятный ответ по фактам из базы</li>\n<li><strong>Корпоративный чат (Open WebUI)</strong> — тот же помощник доступен там, где привыкли работать с чатами</li>\n</ul>", "block_title": "GOLEM — поиск по идентификаторам", "author": "Команда платформы · GOLEM"}, {"type": "section", "block_id": "04-Golem", "section": "решение", "section_title": "Решение", "step_id": "решение", "html": "<p>Теперь можно <strong>спросить по-человечески</strong> — система сама найдёт номер в сообщении, <strong>проверит базу</strong> и ответит сводкой. Если записи нет — так и скажет, не «придумает» активный терминал.</p>\n<ul>\n<li>Понимает терминал, мерчанта, ТСП, сеть, партнёра — в том числе если ID спрятан в логе</li>\n<li>Два типичных режима: <strong>«есть ли в базе?»</strong> и <strong>«покажи обзор за последние дни»</strong> (по умолчанию три дня)</li>\n<li>Ответ опирается только на то, что реально нашлось в данных — не на догадку модели</li>\n</ul>\n<p><img alt=\"Как это работает\" src=\"assets/04-Golem/scheme.svg\" /></p>", "block_title": "GOLEM — поиск по идентификаторам", "author": "Команда платформы · GOLEM"}, {"type": "demo", "block_id": "04-Golem", "src": "assets/04-Golem/Demo-01.jpg", "mime": "image", "index": 1, "total": 4, "step_id": "демо-1", "intro_html": "<p>Покажем в чате: пишем «Покажи информацию по терминалу 12345678» — через полминуты видим привязку к ТСП, статус и была ли активность за последние дни.</p>\n<p>Затем — вставляем кусок лога с JSON: система сама вытащит номера и даст тот же вид проверки без ручного разбора полей.</p>", "block_title": "GOLEM — поиск по идентификаторам", "author": "Команда платформы · GOLEM"}, {"type": "demo", "block_id": "04-Golem", "src": "assets/04-Golem/Demo-02.jpg", "mime": "image", "index": 2, "total": 4, "step_id": "демо-2", "intro_html": "", "block_title": "GOLEM — поиск по идентификаторам", "author": "Команда платформы · GOLEM"}, {"type": "demo", "block_id": "04-Golem", "src": "assets/04-Golem/Demo-03.jpg", "mime": "image", "index": 3, "total": 4, "step_id": "демо-3", "intro_html": "", "block_title": "GOLEM — поиск по идентификаторам", "author": "Команда платформы · GOLEM"}, {"type": "demo", "block_id": "04-Golem", "src": "assets/04-Golem/Demo-04.jpg", "mime": "image", "index": 4, "total": 4, "step_id": "демо-4", "intro_html": "", "block_title": "GOLEM — поиск по идентификаторам", "author": "Команда платформы · GOLEM"}, {"type": "section", "block_id": "04-Golem", "section": "вопросы?", "section_title": "Вопросы?", "step_id": "вопросы?", "html": "<ul>\n<li>А если в справочнике терминала нет, но операции в базе есть — что покажет?</li>\n<li>Можно ли доверять ответу, если его пишет нейросеть, а не человек?</li>\n<li>Это заменяет SQL и отчёты для аналитиков?</li>\n<li>Почему иногда ответ приходит не сразу, а через десяток секунд?</li>\n<li>Кто настраивает, какие поля и период «последних дней» по умолчанию?</li>\n</ul>", "block_title": "GOLEM — поиск по идентификаторам", "author": "Команда платформы · GOLEM"}, {"type": "section", "block_id": "05-Alert-bot presentation", "section": "проблема", "section_title": "Проблема", "step_id": "проблема", "html": "<p>По партнёрам (ТСП) нужно <strong>следить за разными сигналами</strong>: упали начисления или списания, пришли ошибки интеграции, пропали операции, всплеск по методам. Плюс <strong>тестовые среды</strong> для интеграций — ИФТ, ПСИ, шлюзы — должны быть доступны. Отчёты в <strong>почте и на диске</strong>, статусы URL — отдельно; вручную не успеваешь.</p>\n<ul>\n<li><strong>Ошибки SB</strong> — CSV в Outlook; без автоматики легко не заметить рост по партнёру</li>\n<li><strong>Обороты</strong> — выгрузки каждые несколько часов; «кто просел» видно не сразу</li>\n<li><strong>Сырые отчёты</strong> — тысячи строк; нужно вытащить только «флаги» и полезные цифры</li>\n<li><strong>Тестовые стенды</strong> — много URL; падение среды партнёр не увидит, пока не позвонит</li>\n</ul>", "block_title": "Отчётные скрипты по партнёрам", "author": "CPL · Alert-bot"}, {"type": "section", "block_id": "05-Alert-bot presentation", "section": "инструменты", "section_title": "Инструменты", "step_id": "инструменты", "html": "<table>\n<thead>\n<tr>\n<th>Инструмент</th>\n<th>Зачем</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Python + Pandas</strong></td>\n<td>Чтение отчётов, метрики и пороги по каждому ТСП</td>\n</tr>\n<tr>\n<td><strong>Outlook / DWH</strong></td>\n<td>Почта с CSV и файлы выгрузок на <code>Z:\\</code></td>\n</tr>\n<tr>\n<td><strong>Telegram и почта</strong></td>\n<td>Алерт дежурному: отклонение по партнёру или по URL стенда</td>\n</tr>\n<tr>\n<td><strong>GUI (дополнение)</strong></td>\n<td><code>script_manager_gui.py</code> — запуск скриптов, логи, вкладка «Мониторинг»</td>\n</tr>\n</tbody>\n</table>", "block_title": "Отчётные скрипты по партнёрам", "author": "CPL · Alert-bot"}, {"type": "section", "block_id": "05-Alert-bot presentation", "section": "решение", "section_title": "Решение", "step_id": "решение", "html": "<p>Набор <strong>скриптов под задачу</strong> — каждый ищет «флаги» в данных, пересчитывает в понятные метрики и решает, алертить или нет.</p>\n<ul>\n<li><strong>Ошибки SB</strong> — ежедневный разбор писем; «проблемные» партнёры и сводка вместо сырого CSV</li>\n<li><strong>Начисления / списания</strong> — мониторинг ~каждые 3 часа: падение к норме, перекрёстные суммы</li>\n<li><strong>По методам, двойные бонусы, нет операций</strong> — узкие проверки под свой отчёт</li>\n<li><strong>Alert-bot</strong> — инфра-алерты из почты (ключевые слова) в Telegram</li>\n<li><strong>Мониторинг тестовых сред</strong> — <code>monitor_test_envs.py</code>: лёгкая и глубокая проверка URL (шлюзы, СберAPI, ПЦ на ИФТ/ПСИ); статус в GUI</li>\n<li><strong>GUI</strong> — список активных скриптов, «запустить все в фоне», логи и мониторинг в одном окне</li>\n</ul>", "block_title": "Отчётные скрипты по партнёрам", "author": "CPL · Alert-bot"}, {"type": "section", "block_id": "05-Alert-bot presentation", "section": "вопросы?", "section_title": "Вопросы?", "step_id": "вопросы?", "html": "<p><strong>Скрипты и данные</strong></p>\n<ul>\n<li>Как часто каждый скрипт проверяет новые отчёты?</li>\n<li>Можно ли добавить новую проверку — отдельной папкой в проект?</li>\n<li>Откуда берутся пороги «это уже проблема» — настраиваются?</li>\n</ul>\n<p><strong>Алерты, стенды и эксплуатация</strong></p>\n<ul>\n<li>Как часто проверяются тестовые URL — и чем «лёгкая» проверка отличается от «глубокой»?</li>\n<li>Куда уходят сообщения — Telegram, почта или оба?</li>\n<li>Нужен ли один «дежурный» ПК или скрипты могут работать у нескольких людей?</li>\n</ul>", "block_title": "Отчётные скрипты по партнёрам", "author": "CPL · Alert-bot"}, {"type": "demo", "block_id": "05-Alert-bot presentation", "src": "", "mime": "text", "index": 1, "total": 1, "step_id": "демо-1", "intro_html": "<ol>\n<li><strong>Скрипты</strong> — активные отчётные боты: ищут флаги, считают метрики, готовят алерты</li>\n<li><strong>Результат</strong> — не сырой отчёт, а сформатированная сводка: кого смотреть и почему</li>\n<li><strong>Тестовые среды</strong> — вкладка «Мониторинг»: статус URL партнёрских стендов</li>\n<li><strong>На практике</strong> — как команда использует дашборды и мониторинг в работе</li>\n</ol>", "block_title": "Отчётные скрипты по партнёрам", "author": "CPL · Alert-bot"}, {"type": "section", "block_id": "06-tsp-dash presentation", "section": "проблема", "section_title": "Проблема", "step_id": "проблема", "html": "<p>Разобраться с <strong>конкретным партнёром</strong> по разрозненным отчётам неудобно: нужно собрать картину по цифрам, <strong>проанализировать графики</strong> и отдельно <strong>проверить ошибки</strong> — и только потом что-то сформулировать.</p>\n<ul>\n<li>Графики по <strong>начислениям и списаниям</strong> и отчёты по <strong>ошибкам</strong> живут в <strong>разных местах</strong></li>\n<li>Каждый раз заново искать файлы, сводить данные и описывать вывод — долго и легко что-то упустить</li>\n<li>Нет одного экрана, где видно и динамику партнёра, и проблемы, и ошибки интеграции</li>\n</ul>", "block_title": "Дашборд оборотов ТСП", "author": "CPL · СберСпасибо"}, {"type": "section", "block_id": "06-tsp-dash presentation", "section": "инструменты", "section_title": "Инструменты", "step_id": "инструменты", "html": "<table>\n<thead>\n<tr>\n<th>Инструмент</th>\n<th>Зачем</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Python</strong></td>\n<td>На нём написан и собран дашборд — локальное веб-приложение на рабочем ПК</td>\n</tr>\n<tr>\n<td><strong>Outlook</strong></td>\n<td>Здесь лежат ежедневные отчёты по ошибкам партнёров (CSV из почты)</td>\n</tr>\n<tr>\n<td><strong>Диск Z:</strong></td>\n<td>Сетевое хранилище с выгрузками по начислениям и списаниям</td>\n</tr>\n</tbody>\n</table>", "block_title": "Дашборд оборотов ТСП", "author": "CPL · СберСпасибо"}, {"type": "section", "block_id": "06-tsp-dash presentation", "section": "решение", "section_title": "Решение", "step_id": "решение", "html": "<p>Сделали <strong>локальный дашборд</strong> — одно окно в браузере с графиками, цифрами и готовыми срезами. Запуск: <code>START.bat</code>, без отдельного сервера.</p>\n<p>Данные можно смотреть <strong>в разрезе начислений и списаний</strong> — переключаясь между ними в одном интерфейсе, без отдельных Excel и папок для каждого типа оборота.</p>\n<ul>\n<li><strong>Обзор</strong> — KPI, топы и общая картина по начислениям и списаниям за период</li>\n<li><strong>Партнёр</strong> — карточка ТСП: динамика, сравнения и ошибки интеграции на одном экране</li>\n<li><strong>Проблемные</strong> — поиск отклонений по настраиваемым критериям (падения, нули и т.д.)</li>\n<li>Уже загруженные файлы <strong>кэшируются</strong> — не нужно каждый раз искать отчёты заново; быстрее реагировать на отклонения</li>\n</ul>", "block_title": "Дашборд оборотов ТСП", "author": "CPL · СберСпасибо"}, {"type": "section", "block_id": "06-tsp-dash presentation", "section": "вопросы?", "section_title": "Вопросы?", "step_id": "вопросы?", "html": "<p><strong>Доступ и запуск</strong></p>\n<ul>\n<li>Кто может пользоваться дашбордом — только наша команда или коллеги из других подразделений?</li>\n<li>Нужен ли отдельный сервер, или каждый ставит себе на рабочий ПК?</li>\n<li>Что нужно для первого запуска — только доступ к <code>Z:\\</code> или ещё что-то?</li>\n</ul>\n<p><strong>Данные</strong></p>\n<ul>\n<li>Как часто обновляются цифры — каждый день автоматически или нужно что-то нажимать?</li>\n<li>Можно ли смотреть историю за прошлые месяцы или только «свежие» данные?</li>\n<li>Откуда берутся ошибки — это те же отчёты, что приходят на почту?</li>\n</ul>", "block_title": "Дашборд оборотов ТСП", "author": "CPL · СберСпасибо"}, {"type": "demo", "block_id": "06-tsp-dash presentation", "src": "", "mime": "text", "index": 1, "total": 1, "step_id": "демо-1", "intro_html": "<ol>\n<li><strong>Обзор</strong> — общие вводные: KPI и топы по начислениям и списаниям</li>\n<li><strong>Партнёр</strong> — на примере <strong>Мегамаркет</strong>: динамика начислений и показатели за период</li>\n<li><strong>Партнёр</strong> — <strong>Мегамаркет</strong>: ошибки интеграции, динамика и топ типов</li>\n<li><strong>Проблемные</strong> — партнёры с отклонениями по заданным критериям</li>\n</ol>", "block_title": "Дашборд оборотов ТСП", "author": "CPL · СберСпасибо"}, {"type": "section", "block_id": "07-api-tester", "section": "проблема", "section_title": "Проблема", "step_id": "проблема", "html": "<p>Проверка API и создание отчёта на тестовых стендах часто занимает много времени</p>\n<ul>\n<li><strong>Регресс тесты</strong> после релиза — долгий ручной прогон</li>\n<li>Форимирование отчёта о тестировании занимает много времени</li>\n<li>Повторяющиеся проверки и поддержка тестовых пользователей с разными переменными</li>\n</ul>\n<hr />", "block_title": "API Tester", "author": "Команда · локальное тестирование REST API"}, {"type": "section", "block_id": "07-api-tester", "section": "инструменты", "section_title": "Инструменты", "step_id": "инструменты", "html": "<ul>\n<li><strong>Python + браузер</strong> — <code>run.bat</code>, без Docker и отдельной БД</li>\n<li><strong>Импорт Postman</strong> — перенос знакомых коллекций и скриптов</li>\n<li><strong>Профили проверок</strong> — код, JSON, время ответа; часть Postman Tests подхватывается сама</li>\n<li><strong>Пресеты и планировщик</strong> — сохранить настройки тестового прогона в файл, запуск по расписанию</li>\n</ul>\n<hr />", "block_title": "API Tester", "author": "Команда · локальное тестирование REST API"}, {"type": "section", "block_id": "07-api-tester", "section": "решение", "section_title": "Решение", "step_id": "решение", "html": "<p><strong>API Tester</strong> — локальный контур для автоматизации проверки и выполнения регресса API.</p>\n<ul>\n<li><strong>Единные коллекции и переменные</strong> — получение переменных из ответа — в следующий шаг прогона</li>\n<li><strong>Запуск тестов</strong> — дорожки с разными переменными, повторы, доп. запросы при ошибке и возможность сохранять и загружать настройки прогонов</li>\n<li><strong>Отчёты и экспорт</strong> — HTML / Word, выгрузка коллекций обратно в Postman</li>\n</ul>\n<p><img alt=\"Как устроен прогон: Коллекции → Профили → Запуск → Отчёт\" src=\"assets/07-api-tester/assets/scheme.svg\" /></p>\n<p><em>Локально на ПК · run.bat</em></p>\n<hr />", "block_title": "API Tester", "author": "Команда · локальное тестирование REST API"}, {"type": "demo", "block_id": "07-api-tester", "src": "assets/07-api-tester/01-collections.mp4", "mime": "video", "index": 1, "total": 4, "step_id": "демо-1", "intro_html": "", "block_title": "API Tester", "author": "Команда · локальное тестирование REST API"}, {"type": "demo", "block_id": "07-api-tester", "src": "assets/07-api-tester/01-collections.png", "mime": "image", "index": 2, "total": 4, "step_id": "демо-2", "intro_html": "", "block_title": "API Tester", "author": "Команда · локальное тестирование REST API"}, {"type": "demo", "block_id": "07-api-tester", "src": "assets/07-api-tester/02-run.mp4", "mime": "video", "index": 3, "total": 4, "step_id": "демо-3", "intro_html": "", "block_title": "API Tester", "author": "Команда · локальное тестирование REST API"}, {"type": "demo", "block_id": "07-api-tester", "src": "assets/07-api-tester/02-run.png", "mime": "image", "index": 4, "total": 4, "step_id": "демо-4", "intro_html": "", "block_title": "API Tester", "author": "Команда · локальное тестирование REST API"}, {"type": "section", "block_id": "07-api-tester", "section": "вопросы?", "section_title": "Вопросы?", "step_id": "вопросы?", "html": "<ul>\n<li>Можно ли передать сценарий коллеге одной папкой или пресетами?</li>\n<li>Что делать, если API изменился?</li>\n<li>Подходит ли для ночных прогонов без участия человека?</li>\n</ul>", "block_title": "API Tester", "author": "Команда · локальное тестирование REST API"}, {"type": "section", "block_id": "10-agent_tester", "section": "проблема", "section_title": "Проблема", "step_id": "проблема", "html": "<p>После каждого обновления чат-бота соседние команды <strong>вручную</strong> задавали одни и те же вопросы в интерфейсе — долго, по-разному и без единой «оценки».</p>\n<ul>\n<li>Не было общего чек-листа: что считать нормальным ответом</li>\n<li>Результаты проверки оставались в переписках, а не в одном отчёте</li>\n<li>Сложно сравнить: стало лучше или хуже после смены модели или инструкций</li>\n</ul>\n<p>Раньше на такую «санитарную» проверку уходили часы; ошибки замечали уже у пользователей.</p>", "block_title": "AgentTester — проверка ответов чат-бота", "author": "Команда платформы · автоматизация качества"}, {"type": "section", "block_id": "10-agent_tester", "section": "инструменты", "section_title": "Инструменты", "step_id": "инструменты", "html": "<ul>\n<li><strong>Сценарии в Markdown</strong> — файл с вопросами и эталонными ответами (как согласованный «правильный разбор»)</li>\n<li><strong>Open WebUI</strong> — корпоративный чат, куда уходят вопросы и откуда приходят ответы бота</li>\n<li><strong>GigaChat</strong> — сравнивает ответ бота с эталоном и выставляет оценку с кратким пояснением</li>\n<li><strong>Веб-интерфейс</strong> — запуск прогона и отчёт в браузере (для техников — ещё консольная программа)</li>\n</ul>", "block_title": "AgentTester — проверка ответов чат-бота", "author": "Команда платформы · автоматизация качества"}, {"type": "section", "block_id": "10-agent_tester", "section": "решение", "section_title": "Решение", "step_id": "решение", "html": "<p>Сделали <strong>автоматическую проверку</strong>: один запуск прогоняет все сценарии и выдаёт <strong>понятный отчёт</strong> — где бот ответил хорошо, где нет и почему.</p>\n<ul>\n<li>Вопрос уходит боту → ответ сравнивается с эталоном → итог в процентах и комментарий</li>\n<li>Можно прогнать <strong>одни и те же вопросы</strong> на разных настройках или моделях и сравнить в одной таблице</li>\n<li>Отчёт можно показать менеджменту и смежникам <strong>без погружения в код</strong></li>\n</ul>\n<p><img alt=\"Как это работает\" src=\"assets/10-agent_tester/scheme.svg\" /></p>\n<p>Технически: репозиторий <a href=\"https://github.com/timptr42/agenttester\">agenttester</a>, развёртывание в Docker, данные и сценарии хранятся на сервере.</p>", "block_title": "AgentTester — проверка ответов чат-бота", "author": "Команда платформы · автоматизация качества"}, {"type": "demo", "block_id": "10-agent_tester", "src": "assets/10-agent_tester/demo-01.svg", "mime": "image", "index": 1, "total": 3, "step_id": "демо-1", "intro_html": "<p>Покажем: открываем страницу → выбираем сценарий и бота → нажимаем «запуск» → смотрим прогресс → открываем отчёт: вопрос, эталон, ответ бота, оценка и пояснение по каждому пункту.</p>", "block_title": "AgentTester — проверка ответов чат-бота", "author": "Команда платформы · автоматизация качества"}, {"type": "demo", "block_id": "10-agent_tester", "src": "assets/10-agent_tester/demo-02.mp4", "mime": "video", "index": 2, "total": 3, "step_id": "демо-2", "intro_html": "", "block_title": "AgentTester — проверка ответов чат-бота", "author": "Команда платформы · автоматизация качества"}, {"type": "demo", "block_id": "10-agent_tester", "src": "assets/10-agent_tester/demo-03.svg", "mime": "image", "index": 3, "total": 3, "step_id": "демо-3", "intro_html": "", "block_title": "AgentTester — проверка ответов чат-бота", "author": "Команда платформы · автоматизация качества"}, {"type": "section", "block_id": "10-agent_tester", "section": "вопросы?", "section_title": "Вопросы?", "step_id": "вопросы?", "html": "<ul>\n<li>Нужно ли каждый раз вручную готовить эталонные ответы — кто их согласует?</li>\n<li>Можно ли доверять оценке, если её ставит не человек, а вторая нейросеть?</li>\n<li>Что делать, если бот «умный», но формулировки не совпадают с эталоном дословно?</li>\n<li>Как часто имеет смысл гонять проверку — только перед релизом или регулярно?</li>\n</ul>", "block_title": "AgentTester — проверка ответов чат-бота", "author": "Команда платформы · автоматизация качества"}, {"type": "questions", "title": "Вопросы?", "subtitle": "Спасибо!", "html": "", "videos": ["assets/99-questions/placeholder-1.mp4", "assets/99-questions/placeholder-2.mp4", "assets/99-questions/placeholder-3.mp4"], "block_id": "99-questions"}];

    const deck = document.getElementById('deck');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const progressCount = document.getElementById('progress-count');

    let index = 0;
    let wheelLocked = false;
    const BG_CROSSFADE_MS = 1000;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderTalkHeader(data, sectionTitle) {
      const author = data.author
        ? `<p class="project-author">${escapeHtml(data.author)}</p>`
        : '';
      const step = sectionTitle
        ? `<span class="talk-step">[${escapeHtml(sectionTitle.toLowerCase())}]</span>`
        : '';
      return `
        <header class="talk-header">
          <div class="talk-identity">
            <h1 class="project-title">
              <span>${escapeHtml(data.block_title || '')}</span>
              ${step}
            </h1>
            ${author}
          </div>
        </header>
      `;
    }

    function renderSlide(data, i) {
      const el = document.createElement('section');
      el.className = 'slide';
      el.dataset.index = String(i);

      if (data.type === 'welcome' || data.type === 'questions') {
        el.classList.add('cinematic');
        el.innerHTML = `
          <div class="bg-video-stack" aria-hidden="true">
            <video class="bg-video bg-video-a" muted playsinline preload="auto"></video>
            <video class="bg-video bg-video-b" muted playsinline preload="auto"></video>
          </div>
          <div class="cinematic-banner">
            <div class="cinematic-content cinematic">
              <h1>${escapeHtml(data.title || '')}</h1>
              ${data.subtitle ? `<p class="subtitle">${escapeHtml(data.subtitle)}</p>` : ''}
            </div>
          </div>
        `;
        el.dataset.videos = JSON.stringify(data.videos || []);
        return el;
      }

      if (data.type === 'demo') {
        el.classList.add('demo');
        const media = data.mime === 'video'
          ? `<video src="${data.src}" controls playsinline preload="metadata"></video>`
          : data.mime === 'image'
            ? `<img src="${data.src}" alt="Демо ${data.index}">`
            : `<p>Нет медиа</p>`;
        const demoTitle = data.total > 1
          ? `Демо ${data.index} / ${data.total}`
          : 'Демо';
        el.innerHTML = `
          ${renderTalkHeader(data, demoTitle)}
          <div class="slide-body demo-body">
            <div class="demo-intro">${data.intro_html || ''}</div>
            <div class="demo-media">${media}</div>
          </div>
        `;
        return el;
      }

      el.classList.add('content');
      el.innerHTML = `
        ${renderTalkHeader(data, data.section_title || '')}
        <div class="slide-body">${data.html || ''}</div>
      `;
      return el;
    }

    function buildDeck() {
      SLIDES.forEach((s, i) => deck.appendChild(renderSlide(s, i)));
    }

    function stopBgVideo() {
      deck.querySelectorAll('.slide.cinematic').forEach((slide) => {
        if (typeof slide._bgStop === 'function') slide._bgStop();
      });
    }

    function startBgRotation(slideEl) {
      stopBgVideo();
      const raw = slideEl.dataset.videos;
      if (!raw) return;
      const urls = JSON.parse(raw);
      if (!urls.length) return;

      const stack = slideEl.querySelector('.bg-video-stack');
      const layers = stack ? Array.from(stack.querySelectorAll('.bg-video')) : [];
      if (layers.length < 2) return;

      let front = 0;
      let back = 1;
      let currentIdx = Math.floor(Math.random() * urls.length);
      let transitioning = false;
      let stopped = false;

      function resetLayerClasses(v) {
        v.classList.remove('is-base', 'is-overlay', 'reveal', 'visible');
      }

      layers.forEach((v) => {
        v.muted = true;
        v.playsInline = true;
        v.loop = false;
        v.preload = 'auto';
        resetLayerClasses(v);
      });

      function pickNextIdx() {
        if (urls.length === 1) return 0;
        let next;
        do {
          next = Math.floor(Math.random() * urls.length);
        } while (next === currentIdx);
        return next;
      }

      function waitReady(video) {
        return new Promise((resolve) => {
          if (video.readyState >= 4) {
            resolve();
            return;
          }
          const done = () => {
            video.removeEventListener('canplaythrough', done);
            video.removeEventListener('canplay', done);
            video.removeEventListener('error', done);
            resolve();
          };
          video.addEventListener('canplaythrough', done);
          video.addEventListener('canplay', done);
          video.addEventListener('error', done);
        });
      }

      function loadInto(video, idx) {
        const url = urls[idx];
        if (video.dataset.src !== url) {
          video.dataset.src = url;
          video.src = url;
          video.load();
        } else {
          video.currentTime = 0;
        }
        return waitReady(video).then(() => video.play().catch(() => {}));
      }

      function revealOverlay(overlayEl) {
        overlayEl.classList.add('is-overlay');
        overlayEl.classList.remove('reveal');
        void overlayEl.offsetWidth;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => overlayEl.classList.add('reveal'));
        });
      }

      function bindAdvanceHandlers(active) {
        active.onended = () => crossfadeToNext();
        active.ontimeupdate = () => {
          const dur = active.duration;
          if (!dur || dur < 2) return;
          if (active.currentTime >= dur - 1.2) {
            active.ontimeupdate = null;
            crossfadeToNext();
          }
        };
      }

      async function crossfadeToNext() {
        if (stopped || transitioning) return;
        transitioning = true;

        const frontEl = layers[front];
        const backEl = layers[back];
        const nextIdx = pickNextIdx();

        frontEl.onended = null;
        frontEl.ontimeupdate = null;

        resetLayerClasses(backEl);
        await loadInto(backEl, nextIdx);
        if (stopped) {
          transitioning = false;
          return;
        }

        /* нижний слой остаётся на 100% — верхний плавно накрывает */
        revealOverlay(backEl);

        window.setTimeout(() => {
          if (stopped) return;
          resetLayerClasses(frontEl);
          frontEl.pause();
          frontEl.removeAttribute('src');
          delete frontEl.dataset.src;
          frontEl.load();

          resetLayerClasses(backEl);
          backEl.classList.add('is-base');

          currentIdx = nextIdx;
          [front, back] = [back, front];
          bindAdvanceHandlers(layers[front]);
          transitioning = false;
        }, BG_CROSSFADE_MS + 50);
      }

      slideEl._bgStop = () => {
        stopped = true;
        layers.forEach((v) => {
          v.onended = null;
          v.ontimeupdate = null;
          v.pause();
          v.removeAttribute('src');
          delete v.dataset.src;
          resetLayerClasses(v);
          v.load();
        });
        delete slideEl._bgStop;
      };

      (async () => {
        const first = layers[0];
        await loadInto(first, currentIdx);
        if (stopped) return;
        first.classList.add('is-base');
        bindAdvanceHandlers(first);
      })();
    }

    function pauseInactiveMedia() {
      deck.querySelectorAll('video').forEach(v => {
        if (!v.classList.contains('bg-video')) v.pause();
      });
    }

    function pauseDemoVideos(slideEl) {
      slideEl.querySelectorAll('.demo-media video').forEach((v) => {
        v.pause();
      });
    }

    function updateUI() {
      const nodes = deck.querySelectorAll('.slide');
      nodes.forEach((n, i) => n.classList.toggle('active', i === index));

      const current = SLIDES[index] || {};
      stopBgVideo();

      const activeEl = nodes[index];
      if (activeEl) {
        if (current.type === 'welcome' || current.type === 'questions') {
          startBgRotation(activeEl);
        } else if (current.type === 'demo') {
          pauseDemoVideos(activeEl);
        }
      }

      const total = SLIDES.length;
      progressFill.style.width = (total ? ((index + 1) / total) * 100 : 0) + '%';

      let label = current.block_title || current.title || 'Выступление';
      if (current.section_title) label += ' — ' + current.section_title;
      if (current.type === 'demo') label += ' · демо ' + current.index;
      progressLabel.textContent = label;
      progressCount.textContent = (index + 1) + ' / ' + total;
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= SLIDES.length) return;
      pauseInactiveMedia();
      index = next;
      updateUI();
    }

    document.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) < 8) return;
      e.preventDefault();
      if (wheelLocked) return;
      wheelLocked = true;
      setTimeout(() => { wheelLocked = false; }, 380);
      go(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        go(1);
      }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        go(-1);
      }
      if (e.key === 'Home') { index = 0; updateUI(); }
      if (e.key === 'End') { index = SLIDES.length - 1; updateUI(); }
    });

    buildDeck();
    updateUI();
  </script>
</body>
</html>
