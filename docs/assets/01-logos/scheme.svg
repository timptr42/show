<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
  
  <!-- Заголовок -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Схема работы парсера Logos</text>

  <!-- Блок 1: Лог-файл -->
  <rect x="300" y="70" width="300" height="50" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" fill="white" font-size="16" font-weight="bold">📄 Лог-файл / вставленный текст</text>

  <!-- Стрелка 1 -->
  <line x1="450" y1="120" x2="450" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="145" font-size="12" fill="#555">извлечение JSON</text>

  <!-- Блок 2: Парсинг -->
  <rect x="250" y="160" width="400" height="60" rx="8" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="450" y="185" text-anchor="middle" fill="white" font-size="15" font-weight="bold">🔍 Поиск URL-паттернов</text>
  <text x="450" y="205" text-anchor="middle" fill="white" font-size="12">/purchases/{receiptId}/bonusSpend</text>

  <!-- Стрелка 2 (вниз) -->
  <line x1="450" y1="220" x2="450" y2="260" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Блок 3: Развилка -->
  <rect x="250" y="260" width="400" height="50" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="450" y="285" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Есть /confirmation?</text>

  <!-- Левая ветка: ДА -->
  <line x1="250" y1="285" x2="120" y2="285" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="180" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">ДА</text>

  <rect x="30" y="310" width="180" height="100" rx="8" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="120" y="335" text-anchor="middle" fill="white" font-size="14" font-weight="bold">✅ Режим чеков</text>
  <text x="120" y="355" text-anchor="middle" fill="white" font-size="11">• receiptId из URL</text>
  <text x="120" y="375" text-anchor="middle" fill="white" font-size="11">• bankCardAmount из JSON</text>
  <text x="120" y="395" text-anchor="middle" fill="white" font-size="11">• resethold (если есть)</text>

  <!-- Правая ветка: НЕТ -->
  <line x1="650" y1="285" x2="780" y2="285" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="715" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">НЕТ</text>

  <rect x="690" y="310" width="180" height="100" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="780" y="335" text-anchor="middle" fill="white" font-size="14" font-weight="bold">⚠️ Резервный режим</text>
  <text x="780" y="355" text-anchor="middle" fill="white" font-size="11">• Поиск статусов</text>
  <text x="780" y="375" text-anchor="middle" fill="white" font-size="11">HLD → CLD → NEW</text>
  <text x="780" y="395" text-anchor="middle" fill="white" font-size="11">• Все JSON с пояснением</text>

  <!-- Объединяющая стрелка -->
  <line x1="120" y1="410" x2="120" y2="470" stroke="#555" stroke-width="2"/>
  <line x1="780" y1="410" x2="780" y2="470" stroke="#555" stroke-width="2"/>
  <line x1="120" y1="470" x2="780" y2="470" stroke="#555" stroke-width="2"/>
  <line x1="450" y1="470" x2="450" y2="510" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Блок 4: Результат -->
  <rect x="200" y="510" width="500" height="110" rx="8" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
  <text x="450" y="535" text-anchor="middle" fill="white" font-size="16" font-weight="bold">📊 Результат</text>
  <text x="450" y="558" text-anchor="middle" fill="white" font-size="12">• Таблица товаров (количество, цены, скидки)</text>
  <text x="450" y="578" text-anchor="middle" fill="white" font-size="12">• Итоги по чеку: расчётная оплата / фактическая оплата</text>
  <text x="450" y="598" text-anchor="middle" fill="white" font-size="12">• Экспорт в Excel, CSV, JSON</text>

  <!-- Определения стрелок -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
  </defs>

</svg>